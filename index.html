<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTU ECE Portal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px; 
            background: var(--tg-theme-bg-color, #ffffff); 
            color: var(--tg-theme-text-color, #000000); 
        }
        h2 { text-align: center; margin-bottom: 15px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: var(--tg-theme-secondary-bg-color, #f0f0f0); color: var(--tg-theme-text-color, #000000); }
        .tab-btn.active { background: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #ffffff); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--tg-theme-hint-color, #999999); }
        select, input, button { 
            width: 100%; padding: 12px; border-radius: 8px; 
            border: 1px solid var(--tg-theme-hint-color, #cccccc); 
            font-size: 16px; box-sizing: border-box; 
            background: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000);
        }
        select:disabled, input:disabled, button:disabled { opacity: 0.5; }
        button[type="submit"] { 
            background: var(--tg-theme-button-color, #3390ec); 
            color: var(--tg-theme-button-text-color, #ffffff); 
            border: none; font-weight: bold; font-size: 18px; margin-top: 10px; cursor: pointer;
        }
        .section { display: none; }
        .section.active { display: block; }
        .material-card { background: var(--tg-theme-secondary-bg-color, #f8f9fa); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .material-card a { color: var(--tg-theme-link-color, #3390ec); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('upload')">📤 Upload</button>
        <button class="tab-btn" onclick="switchTab('find')">📚 Find Materials</button>
    </div>

    <!-- UPLOAD SECTION -->
    <div id="uploadSection" class="section active">
        <h2>Upload Material</h2>
        <form id="uploadForm">
            <div class="form-group">
                <label>Academic Year</label>
                <select id="upYear" required>
                    <option value="">Select Year...</option>
                    <option value="2">Year II</option>
                    <option value="3">Year III</option>
                    <option value="4">Year IV</option>
                    <option value="5">Year V</option>
                </select>
            </div>
            <div class="form-group">
                <label>Semester</label>
                <select id="upSem" required disabled>
                    <option value="">Select Semester...</option>
                    <option value="1">Semester I</option>
                    <option value="2">Semester II</option>
                </select>
            </div>
            <div class="form-group">
                <label>Course</label>
                <select id="upCourse" required disabled><option value="">Select Course...</option></select>
            </div>
            <div class="form-group">
                <label>Material Type</label>
                <select id="upType" required disabled>
                    <option value="">Select Type...</option>
                    <option value="note">📝 Note</option>
                    <option value="assignment">📄 Assignment</option>
                    <option value="mid">📝 Mid Exam</option>
                    <option value="final">📝 Final Exam</option>
                    <option value="test">⏳ Test</option>
                </select>
            </div>
            <div class="form-group">
                <label>Select File or Photo</label>
                <input type="file" id="fileInput" required disabled>
            </div>
            <button type="submit" id="submitBtn" disabled>Send to Admin</button>
        </form>
    </div>

    <!-- FIND MATERIALS SECTION -->
    <div id="findSection" class="section">
        <h2>Find Materials</h2>
        <div class="form-group">
            <label>Academic Year</label>
            <select id="findYear">
                <option value="">Select Year...</option>
                <option value="2">Year II</option>
                <option value="3">Year III</option>
                <option value="4">Year IV</option>
                <option value="5">Year V</option>
            </select>
        </div>
        <div class="form-group">
            <label>Semester</label>
            <select id="findSem" disabled><option value="">Select Semester...</option><option value="1">Semester I</option><option value="2">Semester II</option></select>
        </div>
        <div class="form-group">
            <label>Course</label>
            <select id="findCourse" disabled><option value="">Select Course...</option></select>
        </div>
        <div class="form-group">
            <label>Material Type</label>
            <select id="findType" disabled>
                <option value="">Select Type...</option>
                <option value="note">📝 Note</option>
                <option value="assignment">📄 Assignment</option>
                <option value="mid">📝 Mid Exam</option>
                <option value="final">📝 Final Exam</option>
                <option value="test">⏳ Test</option>
            </select>
        </div>
        <div id="resultsContainer" style="margin-top: 20px;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const RENDER_URL = "https://scribed-1rqs.onrender.com";

        const curriculum = {
            "2": {
                "1": [{code: "Math2101", title: "Applied Mathematics III"}, {code: "ECEg2201", title: "Electronics Circuit I"}, {code: "EPCE2101", title: "Fundamentals of Electrical Eng."}, {code: "CSEg2101", title: "Data Structures & Algorithms"}, {code: "LART1004", title: "Geography of Ethiopia & the Horn"}],
                "2": [{code: "ECEg2202", title: "Electronic Circuit II"}, {code: "ECEg2204", title: "Signals and System Analysis"}, {code: "EPCE2202", title: "Electromagnetic Field"}, {code: "ECEg2208", title: "Eng. Application Software"}, {code: "Math2103", title: "Computational methods"}, {code: "Math2201", title: "Linear Algebra"}]
            },
            "3": {
                "1": [{code: "ECEg3201", title: "Digital Logic Design"}, {code: "EPCE3201", title: "Network Analysis & Synthesis"}, {code: "ECEg3103", title: "Probability & Random Proc."}, {code: "ECEg3205", title: "Digital Signal Processing"}, {code: "LART2002", title: "Gen. Psychology & Life Skills"}, {code: "Phys2208", title: "Applied Modern Physics"}],
                "2": [{code: "ECEg3202", title: "Intro to Comm. Systems"}, {code: "Phys3202", title: "Solid State Physics"}, {code: "LART1003", title: "History of Ethiopia & the Horn"}, {code: "ECEg3306", title: "Microelectronic Devices & Circuits"}, {code: "ECEg3318", title: "Optoelectronics"}, {code: "CSEg2202", title: "Object Oriented Programming"}, {code: "SEng4208", title: "Intro to Artificial Intelligence"}, {code: "EPCE3304", title: "Intro to Control Systems"}, {code: "EPCE3302", title: "Intro to Electrical Machines"}]
            },
            "4": {
                "1": [{code: "ECEg4201", title: "Comp. Architecture & Org."}, {code: "ECEg4203", title: "Digital Communication"}, {code: "ECEg4205", title: "EM Waves & Guide Structure"}, {code: "SOSC5003", title: "Entrepreneurship & Bus. Dev."}, {code: "ECEg4206", title: "Eng. Research & Dev Methodology"}, {code: "EPCE3206", title: "Intro to Power Systems"}, {code: "EPCE3207", title: "Electrical Measurement & Inst."}],
                "2": [{code: "ECEg4202", title: "Microprocessor & Interfacing"}, {code: "ECEg4204", title: "Antenna & Radio Wave Prop."}, {code: "ECEg4208", title: "Data Comm. & Computer Networks"}, {code: "SOSC2002", title: "Introduction to Economics"}, {code: "IETP4203", title: "Integrated Engineering Project"}, {code: "ECEg4310", title: "Microwave Devices & Systems"}, {code: "ECEg4312", title: "Integrated Circuit Technology"}]
            },
            "5": {
                "1": [{code: "ECEg5201", title: "Wireless & Mobile Comm."}, {code: "ECEg5203", title: "Capstone Project"}, {code: "ECEg5207", title: "Final Year Project Phase I"}, {code: "ECEg5307", title: "VLSI Design"}, {code: "CSEg5307", title: "Advanced Network"}, {code: "ECEg5315", title: "Embedded & Real Time Systems"}, {code: "EPCE4302", title: "Prog. Logic Controllers & Robotics"}, {code: "EPCE4306", title: "Introduction to Mechatronics"}, {code: "ECEg5321", title: "Biomedical Inst. & Analysis"}, {code: "EPCE3202", title: "Power Electronics"}],
                "2": [{code: "SOSC5011", title: "Project Mgt. for Engineers"}, {code: "ECEg5202", title: "Final Year Project Phase II"}, {code: "ECEg5302", title: "Optics & Optical Comm."}, {code: "ECEg5304", title: "Analysis & Design of Digital IC"}, {code: "ECEg5306", title: "Telecom Networks & Switching"}, {code: "ECEg5308", title: "Intro to Computer Vision"}, {code: "ECEg5310", title: "Satellite Communication"}, {code: "ECEg5312", title: "Digital Hardware Design"}, {code: "ECEg5314", title: "Digital Image Processing"}, {code: "ECEg5316", title: "Semiconductor Devices"}]
            }
        };

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            if(tab === 'upload') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('uploadSection').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('findSection').classList.add('active');
            }
        }

        // Upload Cascading Logic
        const upYear = document.getElementById('upYear'), upSem = document.getElementById('upSem'), upCourse = document.getElementById('upCourse'), upType = document.getElementById('upType'), fileInput = document.getElementById('fileInput'), submitBtn = document.getElementById('submitBtn');
        upYear.onchange = () => { upSem.disabled = !upYear.value; upSem.value=""; upCourse.innerHTML='<option value="">Select Course...</option>'; upCourse.disabled=true; upType.disabled=true; fileInput.disabled=true; submitBtn.disabled=true; };
        upSem.onchange = () => {
            upCourse.innerHTML='<option value="">Select Course...</option>';
            if(upYear.value && upSem.value) {
                curriculum[upYear.value][upSem.value].forEach(c => upCourse.innerHTML += `<option value="${c.code}">${c.title}</option>`);
                upCourse.disabled = false;
            } else { upCourse.disabled = true; }
            upType.disabled = true; fileInput.disabled = true; submitBtn.disabled = true;
        };
        upCourse.onchange = () => { upType.disabled = !upCourse.value; fileInput.disabled = true; submitBtn.disabled = true; };
        upType.onchange = () => { fileInput.disabled = !upType.value; submitBtn.disabled = true; };
        fileInput.onchange = () => { submitBtn.disabled = !fileInput.files.length; };

        // Find Cascading Logic & Fetching Results
        const findYear = document.getElementById('findYear'), findSem = document.getElementById('findSem'), findCourse = document.getElementById('findCourse'), findType = document.getElementById('findType'), resultsContainer = document.getElementById('resultsContainer');
        findYear.onchange = () => { findSem.disabled = !findYear.value; findSem.value=""; findCourse.innerHTML='<option value="">Select Course...</option>'; findCourse.disabled=true; findType.disabled=true; resultsContainer.innerHTML=""; };
        findSem.onchange = () => {
            findCourse.innerHTML='<option value="">Select Course...</option>';
            if(findYear.value && findSem.value) {
                curriculum[findYear.value][findSem.value].forEach(c => findCourse.innerHTML += `<option value="${c.code}">${c.title}</option>`);
                findCourse.disabled = false;
            } else { findCourse.disabled = true; }
            findType.disabled = true; resultsContainer.innerHTML="";
        };
        findCourse.onchange = () => { findType.disabled = !findCourse.value; resultsContainer.innerHTML=""; };
        findType.onchange = fetchMaterials;

        async function fetchMaterials() {
            const course = findCourse.value;
            const type = findType.value;
            if(!course || !type) return;

            resultsContainer.innerHTML = "<p>Loading materials...</p>";
            try {
                const res = await fetch(`${RENDER_URL}/api/materials`);
                const data = await res.json();
                const key = `${course}_${type}`;
                const items = data[key] || [];

                if(items.length === 0) {
                    resultsContainer.innerHTML = "<p>ℹ️ No materials found for this selection yet.</p>";
                } else {
                    resultsContainer.innerHTML = `<h3>Found ${items.length} file(s):</h3>`;
                    items.forEach(item => {
                        resultsContainer.innerHTML += `
                            <div class="material-card">
                                <span>📄 ${item.name}</span>
                                <a href="https://t.me/astuece2026_bot?start=get_${item.file_id}" target="_blank">Open in Bot</a>
                            </div>`;
                    });
                }
            } catch(e) {
                resultsContainer.innerHTML = "<p>⚠️ Error connecting to server.</p>";
            }
        }

        // Form Submit
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.innerText = "Uploading..."; submitBtn.disabled = true;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('course', upCourse.value);
            formData.append('type', upType.value);
            formData.append('username', tg.initDataUnsafe?.user?.username ? `@${tg.initDataUnsafe.user.username}` : "Student");

            try {
                const res = await fetch(`${RENDER_URL}/api/upload`, { method: 'POST', body: formData });
                if(res.ok) {
                    tg.showAlert("Success! Material sent to admin.");
                    tg.close();
                } else {
                    tg.showAlert("Upload failed.");
                    submitBtn.innerText = "Send to Admin"; submitBtn.disabled = false;
                }
            } catch(e) {
                tg.showAlert("Network error.");
                submitBtn.innerText = "Send to Admin"; submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
